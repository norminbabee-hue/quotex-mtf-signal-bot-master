[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quotex-mtf-signal-bot"
version = "0.1.0"
description = "MT5-based multi-timeframe research and signal system"
requires-python = ">=3.11"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35,<2"]
telegram = ["python-telegram-bot>=21,<23"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
all = ["streamlit>=1.35,<2", "python-telegram-bot>=21,<23", "pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
